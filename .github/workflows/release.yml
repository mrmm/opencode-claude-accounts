name: Release

on:
  push:
    branches:
      - main
  # Re-run the screenshots for an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)attach screenshots to, e.g. v3.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Version and changelog come from conventional commits via the manifest.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: pnpm/action-setup@v4

      # Node 24 ships npm 11, which publishes through npm trusted publishing (OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: Pack
        id: pack
        run: |
          file=$(npm pack --silent)
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "${{ steps.pack.outputs.file }}" "${{ steps.pack.outputs.file }}.sha256" --clobber

      # NPM_TOKEN is only needed until trusted publishing is configured on npmjs.com;
      # without it npm authenticates through the workflow's OIDC token.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.file }}" --provenance --access public

  # Every release carries a PNG per feature; its notes show only the features
  # whose files changed since the previous tag. Rendered from demo accounts.
  screenshots:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload assets, edit the release notes
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit: the release commit on a release, and the
      # current code on a backfill (an older tag may predate the script).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag, to see what changed

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core

      - name: Render
        run: |
          node --experimental-strip-types scripts/screenshots.ts render shots
          for f in shots/*.svg; do rsvg-convert -z 2 "$f" -o "${f%.svg}.png"; done

      # The real TUI, through VHS. Never blocks a release: without it the notes
      # just leave the capture out.
      - name: Capture the real TUI
        continue-on-error: true
        timeout-minutes: 8
        env:
          OPENCODE_VERSION: "2.2.7"
          VHS_VERSION: "0.10.0"
          VHS_NO_SANDBOX: "true"
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          curl -fsSL -o "$bin/ttyd" https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x "$bin/ttyd"
          curl -fsSL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/vhs_*/vhs "$bin/"
          curl -fsSL "https://opencode.ai/files/bin/${OPENCODE_VERSION}/opencode-linux-x64-baseline.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 2 -name opencode -type f -exec mv {} "$bin/" \;
          opencode --version
          pnpm run build
          # VHS sometimes fails to start its browser; once more usually works.
          # A fresh home each time, so a retry does not show a second session.
          for i in 1 2; do
            home="$RUNNER_TEMP/demo-home-$i"
            # OpenCode keeps its server running after the TUI exits; a new TUI
            # would attach to the old one and its config.
            pkill -x opencode || true
            scripts/tui-capture/seed.sh "$home" .
            # The runner sets XDG_*, which would point OpenCode back at the
            # runner's own config and leave the plugin out of the picture.
            env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME \
              HOME="$home" vhs scripts/tui-capture/sidebar.tape &&
              grep -q "loading plugin\" id=$PWD " "$home/.local/share/opencode/log/opencode.log" &&
              [ -s shots/tui.png ] && break
            rm -f shots/tui.png
          done
          [ -s shots/tui.png ]

      - name: Attach and feature in the notes
        run: |
          gh release upload "$TAG" shots/*.png --clobber
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then git diff --name-only "$prev" "$TAG"; else git ls-files; fi > changed.txt
          node --experimental-strip-types scripts/screenshots.ts notes "$GITHUB_REPOSITORY" "$TAG" shots < changed.txt > shots.md
          [ -s shots.md ] || exit 0
          gh release view "$TAG" --json body -q .body > notes.md
          # Idempotent: a re-run replaces the section instead of stacking it.
          sed -i '/^## Screenshots$/,$d' notes.md
          { cat notes.md; echo; cat shots.md; } > final.md
          gh release edit "$TAG" --notes-file final.md
